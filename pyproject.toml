[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptyv-agent-evals"
version = "0.1.0"
description = "Evaluation harness for LLM agents acting through a Foundry-style protein engineering API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.40",
    "python-dotenv>=1.0",
]

[project.scripts]
adaptyv-evals = "adaptyv_evals.run_suite:main"

[tool.setuptools]
packages = ["adaptyv_evals"]
